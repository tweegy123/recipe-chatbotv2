<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Chatbot - ABDUL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="toast-container" class="toast-container"></div>

  <div class="app-window">
    
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-circle">A</div>
        <h1>ABDUL<br>Recipe Bot</h1>
        <p>Good Food.<br>Good Mood.</p>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active" id="nav-home" onclick="switchTab('home', event)">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          Home
        </a>
        <a href="#" class="nav-item" id="nav-all" onclick="switchTab('all', event)">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
          All Recipe
        </a>
      </nav>
    </aside>

    <!-- Right Main Content -->
    <main class="main-content">
      
      <!-- Background Waves -->
      <div class="bg-wave"></div>
      <div class="bg-wave-2"></div>

      <div class="chat-container" id="log"></div>

      <!-- Only Quick Meals and Random Recipe remain -->
      <div class="chips-container" id="chips">
        <button class="chip">Quick Meals</button>
        <button class="chip">Random Recipe</button>
      </div>

      <div class="input-area" id="input-area">
        <form id="form" class="input-wrapper">
          <input id="input" type="text" placeholder="Ask for a recipe..." autocomplete="off" maxlength="300">
          <button type="submit" class="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>

    </main>
  </div>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chips = document.getElementById('chips');
    const inputArea = document.getElementById('input-area');
    
    const navHome = document.getElementById('nav-home');
    const navAll = document.getElementById('nav-all');

    function scrollChat() { log.scrollTop = log.scrollHeight; }

    function addMsg(who, text) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + who;

      if (who === 'bot') {
        const avatar = document.createElement('div');
        avatar.className = 'bot-avatar';
        avatar.textContent = 'A'; // Changed to just the letter A
        row.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      
      row.appendChild(bubble);
      log.appendChild(row);
      scrollChat();
      return bubble; 
    }

    function renderRecipes(container, recipes, isFull) {
      recipes.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        
        let html = `<h3>${r.name}</h3>`;
        html += `<p class="meta">⏱ ${r.time} min</p>`;
        
        if (r.tools) {
          html += `<div class="tools">🔧 Tools: ${r.tools.join(', ')}</div>`;
        }

        if (r.have && r.missing) {
          html += `<p style="font-size:0.85rem; color:#4a8b46; margin-bottom:4px;">You have: ${r.have.join(', ')}</p>`;
          if (r.missing.length > 0) {
            html += `<p style="font-size:0.85rem; color:#c4462e; margin-bottom:8px;">Still need: ${r.missing.join(', ')}</p>`;
          }
        }

        if (isFull) {
          html += `<strong style="font-size:0.9rem; display:block; margin-top:10px;">Ingredients:</strong>`;
          html += `<ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`;
          html += `<strong style="font-size:0.9rem; display:block; margin-top:10px;">Steps:</strong>`;
          html += `<ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
        } else {
          html += `<button class="chip" style="font-size:0.8rem; padding:6px 12px; margin-top:8px;" onclick="send('recipe for ${r.name.replace(/'/g, "\\'")}')">See full recipe</button>`;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    function showToast(message, recipeName) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      const actionText = recipeName ? `<span class="toast-action">Click to view</span>` : '';
      
      toast.innerHTML = `
        <div class="toast-icon">✅</div>
        <div class="toast-text">
          <strong>${message}</strong>
          ${actionText}
        </div>
      `;
      
      toast.onclick = () => {
        if (recipeName) send('recipe for ' + recipeName);
        toast.remove(); 
      };

      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);

      const timer = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 400); 
      }, 10000);
      
      toast.addEventListener('click', () => clearTimeout(timer), { once: true });
    }

    async function send(text) {
      addMsg('user', text);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        const bubble = addMsg('bot', data.reply);
        
        const completeRecipes = [];
        if (data.recipes && data.recipes.length > 0) {
          renderRecipes(bubble, data.recipes, data.full);
          
          data.recipes.forEach(r => {
            if (r.missing && r.missing.length === 0) completeRecipes.push(r.name);
          });

          if (completeRecipes.length > 0) {
            completeRecipes.slice(0, 3).forEach(name => showToast(`You can cook ${name}!`, name));
          }
          scrollChat();
        }

      } catch (e) {
        addMsg('bot', 'Sorry, I am having trouble connecting right now.');
      }
    }

    function switchTab(tab, event) {
      if (event) event.preventDefault();
      
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      log.innerHTML = '';

      if (tab === 'home') {
        navHome.classList.add('active');
        chips.classList.remove('hidden');
        inputArea.classList.remove('hidden');
        addMsg('bot', "Hi! I'm your Recipe Assistant!\nWhat would you like to cook today?");
        
      } else if (tab === 'all') {
        navAll.classList.add('active');
        chips.classList.add('hidden');
        inputArea.classList.add('hidden');
        addMsg('bot', "Loading all recipes...");
        loadAllRecipes();
      }
    }

    async function loadAllRecipes() {
      try {
        const res = await fetch('/api/recipes');
        const recipes = await res.json();
        
        log.innerHTML = ''; 
        const bubble = addMsg('bot', `Here are all ${recipes.length} recipes I know:`);
        
        if (recipes.length > 0) {
          renderRecipes(bubble, recipes, false);
          scrollChat();
        }
      } catch (err) {
        log.innerHTML = '';
        addMsg('bot', "Sorry, I couldn't load the recipes right now.");
      }
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = '';
      send(t);
    });

    document.getElementById('chips').addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') {
        send(e.target.textContent);
      }
    });

    addMsg('bot', "Hi! I'm your Recipe Assistant!\nWhat would you like to cook today?");
  </script>
</body>
</html>
