<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABDUL - Recipe Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Notification Container (Bottom Left) -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">
      <div class="logo-circle">A</div>
      <span class="logo-text">ABDUL</span>
    </div>
    <div class="nav-links">
      <a href="#" id="nav-recipes">Recipes</a>
      <a href="#">Saved</a>
      <a href="#">Meal plan</a>
    </div>
  </nav>

  <!-- Home / Hero View -->
  <main id="home-view">
    <section class="hero">
      <h1>Cook something good<br>tonight.</h1>
      <p>Browse thousands of recipes, or just ask ABDUL what to make with what you have.</p>
      <button id="browse-btn" class="cta-button">Browse recipes</button>
    </section>
  </main>

  <!-- Browse All Recipes View -->
  <section id="browse-view" class="hidden">
    <div class="browse-header">
      <h2>All Recipes</h2>
      <button id="back-btn" class="cta-button outline">Back to Home</button>
    </div>
    <div id="recipe-grid" class="recipe-grid"></div>
  </section>

  <!-- Floating Chat Widget -->
  <div class="chat-widget">
    <div class="chat-header">
      <span class="chat-title">ABDUL</span>
      <span class="chat-subtitle">Ask me for a recipe</span>
    </div>
    
    <div id="log" class="log" aria-live="polite"></div>

    <div class="chips" id="chips">
      <button>Under 15 min</button>
      <button>Vegetarian</button>
    </div>

    <form id="form" class="composer">
      <input id="input" type="text" placeholder="Ask for a recipe..." autocomplete="off" maxlength="300" aria-label="Message">
      <button type="submit" style="display: none;">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    // --- Toast Notification Logic ---
    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      // Checkmark emoji for success
      toast.innerHTML = `<span>✅</span> ${message}`;
      container.appendChild(toast);

      // Trigger animation
      setTimeout(() => toast.classList.add('show'), 10);

      // Remove after 4 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300); // Wait for slide out animation
      }, 4000);
    }

    // --- Chat Logic ---
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }
    
    function scrollDown() { log.scrollTop = log.scrollHeight; }
    
    function addMsg(who, text) {
      const m = el('div', 'msg ' + who);
      m.appendChild(el('p', null, text));
      log.appendChild(m);
      scrollDown();
      return m;
    }

    function list(tag, items) {
      const l = el(tag);
      items.forEach(i => l.appendChild(el('li', null, i)));
      return l;
    }

    function card(r, full) {
      const c = el('article', 'card');
      c.appendChild(el('h3', null, r.name));
      c.appendChild(el('p', 'meta', `${r.time} min`));
      if (r.have) {
        if (r.have.length) c.appendChild(el('p', 'have', 'You have: ' + r.have.join(', ')));
        // Updated missing text for clarity
        c.appendChild(el('p', 'miss', r.missing.length ? 'Still need: ' + r.missing.join(', ') : 'You have everything!'));
      }
      if (full) {
        c.appendChild(el('h4', null, 'Ingredients'));
        c.appendChild(list('ul', r.ingredients));
        c.appendChild(el('h4', null, 'Steps'));
        c.appendChild(list('ol', r.steps));
      } else {
        const b = el('button', 'link', 'See recipe');
        b.onclick = () => send('recipe for ' + r.name);
        c.appendChild(b);
      }
      return c;
    }

    async function send(text) {
      addMsg('user', text);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        const m = addMsg('bot', d.reply);
        
        let foundCompleteRecipe = false;

        (d.recipes || []).forEach(r => {
          m.appendChild(card(r, d.full));
          
          // Check if this recipe has NO missing ingredients
          if (r.missing && r.missing.length === 0 && !foundCompleteRecipe) {
            foundCompleteRecipe = true;
            showToast(`You have all ingredients for ${r.name}!`);
          }
        });

      } catch (e) {
        addMsg('bot', 'Sorry, I cannot reach the server right now (' + e.message + ').');
      }
      scrollDown();
    }

    form.addEventListener('submit', e => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = '';
      send(t);
    });

    document.getElementById('chips').addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') {
        send(e.target.textContent);
        document.getElementById('chips').style.display = 'none'; 
      }
    });

    addMsg('bot', 'Hi! What are you in the mood for tonight?');

    // --- Browse Recipes Logic ---
    const homeView = document.getElementById('home-view');
    const browseView = document.getElementById('browse-view');
    const recipeGrid = document.getElementById('recipe-grid');

    async function loadAllRecipes() {
      homeView.classList.add('hidden');
      browseView.classList.remove('hidden');
      recipeGrid.innerHTML = '<p>Loading recipes...</p>';

      try {
        const res = await fetch('/api/recipes');
        if (!res.ok) throw new Error('Failed to fetch');
        const recipes = await res.json();
        
        recipeGrid.innerHTML = '';
        recipes.forEach(r => {
          const item = document.createElement('article');
          item.className = 'grid-card';
          
          const previewIngredients = r.ingredients.slice(0, 4).map(i => `<li>${i.qty} ${i.name}</li>`).join('');
          const moreText = r.ingredients.length > 4 ? `<li>...and more</li>` : '';

          item.innerHTML = `
            <h3>${r.name}</h3>
            <p class="meta">${r.time} min</p>
            <ul class="preview-list">${previewIngredients}${moreText}</ul>
            <button class="link" onclick="askAbout('${r.name.replace(/'/g, "\\'")}')">See full recipe</button>
          `;
          recipeGrid.appendChild(item);
        });
      } catch (err) {
        recipeGrid.innerHTML = '<p>Error loading recipes. Please try again later.</p>';
      }
    }

    function goHome() {
      browseView.classList.add('hidden');
      homeView.classList.remove('hidden');
    }

    function askAbout(name) {
      send('recipe for ' + name);
      document.querySelector('.chat-widget').scrollIntoView({ behavior: 'smooth' });
    }

    document.getElementById('browse-btn').addEventListener('click', loadAllRecipes);
    document.getElementById('nav-recipes').addEventListener('click', (e) => { e.preventDefault(); loadAllRecipes(); });
    document.getElementById('back-btn').addEventListener('click', goHome);
  </script>
</body>
</html>
