<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipe Chatbot - ABDUL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-body: #e8ece8;
      --bg-app: #ffffff;
      --primary-green: #4a8b46;
      --light-green: #e6f0e5;
      --text-dark: #1a2b1a;
      --text-muted: #6b7c6b;
      --border-color: #e0e6df;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-body);
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* --- The App Window --- */
    .app-window {
      width: 95vw;
      max-width: 1100px;
      height: 90vh;
      max-height: 750px;
      background: var(--bg-app);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.1);
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* --- Left Sidebar --- */
    .sidebar {
      width: 260px;
      padding: 40px 24px;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border-color);
      z-index: 2;
    }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      background: var(--primary-green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 16px;
      box-shadow: 0 8px 16px rgba(74, 139, 70, 0.3);
      border: 3px solid var(--light-green);
    }

    .logo-container h1 {
      font-size: 1.4rem;
      color: var(--text-dark);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .logo-container p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 20px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 500;
      font-size: 0.95rem;
      transition: 0.2s;
    }

    .nav-item:hover {
      background: var(--light-green);
    }

    .nav-item.active {
      background: var(--primary-green);
      color: white;
      box-shadow: 0 4px 12px rgba(74, 139, 70, 0.2);
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* --- Right Main Area --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      background: var(--bg-app);
    }

    /* Window Dots (Top Right) */
    .window-dots {
      position: absolute;
      top: 24px;
      right: 30px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot.red { background: #ff5f56; }
    .dot.yellow { background: #ffbd2e; }
    .dot.green { background: #27c93f; }

    /* Background Waves */
    .bg-wave {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 250px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 1440 320' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%23e6f0e5' fill-opacity='1' d='M0,256L48,229.3C96,203,192,149,288,144C384,139,480,181,576,197.3C672,213,768,203,864,181.3C960,160,1056,128,1152,128C1248,128,1344,160,1392,176L1440,192L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z'%3E%3C/path%3E%3C/svg%3E");
      background-size: cover;
      background-position: bottom;
      z-index: 0;
      pointer-events: none;
    }
    
    .bg-wave-2 {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 200px;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 1440 320' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='%234a8b46' fill-opacity='0.1' d='M0,192L60,197.3C120,203,240,213,360,208C480,203,600,181,720,170.7C840,160,960,160,1080,170.7C1200,181,1320,203,1380,213.3L1440,224L1440,320L1380,320C1320,320,1200,320,1080,320C960,320,840,320,720,320C600,320,480,320,360,320C240,320,120,320,60,320L0,320Z'%3E%3C/path%3E%3C/svg%3E");
      background-size: cover;
      background-position: bottom;
      z-index: 0;
      pointer-events: none;
    }

    /* Chat Log Container */
    .chat-container {
      flex: 1;
      padding: 40px 40px 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      z-index: 1;
    }
    
    /* Scrollbar styling */
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

    /* Bot Message */
    .msg-row {
      display: flex;
      gap: 16px;
      margin-bottom: 24px;
      max-width: 80%;
    }

    .bot-avatar {
      width: 45px;
      height: 45px;
      background: #1a233a; /* Dark blue from the robot image */
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--border-color);
      flex-shrink: 0;
    }
    .bot-avatar svg { width: 28px; height: 28px; fill: #4a8b46; }

    .msg-bubble {
      background: var(--light-green);
      padding: 16px 24px;
      border-radius: 20px;
      border-top-left-radius: 4px;
      color: var(--text-dark);
      font-size: 0.95rem;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    /* User Message */
    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }
    .msg-row.user .msg-bubble {
      background: var(--primary-green);
      color: white;
      border-radius: 20px;
      border-top-right-radius: 4px;
      border-top-left-radius: 20px;
    }

    /* Recipe Cards inside Chat */
    .recipe-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      margin-top: 12px;
      width: 100%;
    }
    .recipe-card h3 { font-size: 1.1rem; color: var(--primary-green); margin-bottom: 4px; }
    .recipe-card .meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 12px; }
    .recipe-card ul, .recipe-card ol { padding-left: 20px; font-size: 0.85rem; color: #444; margin-bottom: 8px; }
    .recipe-card .tools { font-size: 0.8rem; color: #666; background: #f5f5f5; padding: 6px 10px; border-radius: 6px; margin-bottom: 12px; display: inline-block;}

    /* Chips */
    .chips-container {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 40px 20px;
      z-index: 1;
    }
    .chip {
      background: transparent;
      border: 1px solid var(--primary-green);
      color: var(--primary-green);
      padding: 10px 20px;
      border-radius: 24px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .chip:hover { background: var(--light-green); }

    /* Input Area */
    .input-area {
      padding: 20px 40px 40px;
      z-index: 1;
    }
    .input-wrapper {
      display: flex;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }
    .input-wrapper input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 20px;
      font-family: inherit;
      font-size: 1rem;
      background: transparent;
    }
    .input-wrapper input::placeholder { color: #a0a0a0; }
    .send-btn {
      background: var(--primary-green);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .send-btn:hover { transform: scale(1.05); background: #3d7539; }
    .send-btn svg { fill: white; width: 20px; height: 20px; margin-left: 2px;}

    /* Responsive */
    @media (max-width: 800px) {
      .app-window { flex-direction: column; height: 100vh; border-radius: 0; width: 100vw; max-width: 100%; max-height: 100vh;}
      .sidebar { display: none; /* Hide sidebar on mobile */ }
      .bg-wave, .bg-wave-2 { height: 150px; }
      .chat-container { padding: 30px 20px 10px; }
      .chips-container { padding: 0 20px 10px; }
      .input-area { padding: 10px 20px 20px; }
      .window-dots { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-window">
    
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="logo-container">
        <div class="logo-circle">A</div>
        <h1>ABDUL<br>Recipe Bot</h1>
        <p>Good Food.<br>Good Mood.</p>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          Home
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M4 4h6v6H4zm10 0h6v6h-6zM4 14h6v6H4zm10 0h6v6h-6z"/></svg>
          Categories
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          Favorites
        </a>
        <a href="#" class="nav-item">
          <svg viewBox="0 0 24 24"><path d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg>
          About
        </a>
      </nav>
    </aside>

    <!-- Right Main Content -->
    <main class="main-content">
      
      <!-- Window Controls (Dots) -->
      <div class="window-dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>

      <!-- Background Waves -->
      <div class="bg-wave"></div>
      <div class="bg-wave-2"></div>

      <!-- Chat Log -->
      <div class="chat-container" id="log">
        <!-- Initial Message is injected via JS -->
      </div>

      <!-- Quick Chips -->
      <div class="chips-container" id="chips">
        <button class="chip">Quick Meals</button>
        <button class="chip">Healthy</button>
        <button class="chip">Dessert</button>
        <button class="chip">Main Dish</button>
        <button class="chip">Snacks</button>
        <button class="chip">Random Recipe</button>
      </div>

      <!-- Input Form -->
      <div class="input-area">
        <form id="form" class="input-wrapper">
          <input id="input" type="text" placeholder="Ask for a recipe..." autocomplete="off" maxlength="300">
          <button type="submit" class="send-btn">
            <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
          </button>
        </form>
      </div>

    </main>
  </div>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');

    // SVG for the Bot Avatar
    const botAvatarSvg = `
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a4 4 0 0 1 4 4v1h1a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-1v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2v-1H5a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h1v-1a4 4 0 0 1 4-4h1V5.73A2 2 0 0 1 10 4a2 2 0 0 1 2-2zm-3 9a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm6 0a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-6 5a4 4 0 0 0 6 0H9z" fill="#4a8b46"/>
      </svg>
    `;

    function scrollChat() {
      log.scrollTop = log.scrollHeight;
    }

    function addMsg(who, text) {
      const row = document.createElement('div');
      row.className = 'msg-row ' + who;

      if (who === 'bot') {
        const avatar = document.createElement('div');
        avatar.className = 'bot-avatar';
        avatar.innerHTML = botAvatarSvg;
        row.appendChild(avatar);
      }

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = text;
      
      row.appendChild(bubble);
      log.appendChild(row);
      scrollChat();
      return bubble; 
    }

    function renderRecipes(container, recipes, isFull) {
      recipes.forEach(r => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        
        let html = `<h3>${r.name}</h3>`;
        html += `<p class="meta">⏱ ${r.time} min</p>`;
        
        if (r.tools) {
          html += `<div class="tools">🔧 Tools: ${r.tools.join(', ')}</div>`;
        }

        if (r.have && r.missing) {
          html += `<p style="font-size:0.85rem; color:#4a8b46; margin-bottom:4px;">You have: ${r.have.join(', ')}</p>`;
          if (r.missing.length > 0) {
            html += `<p style="font-size:0.85rem; color:#c4462e; margin-bottom:8px;">Still need: ${r.missing.join(', ')}</p>`;
          }
        }

        if (isFull) {
          html += `<strong style="font-size:0.9rem; display:block; margin-top:10px;">Ingredients:</strong>`;
          html += `<ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`;
          html += `<strong style="font-size:0.9rem; display:block; margin-top:10px;">Steps:</strong>`;
          html += `<ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
        } else {
          html += `<button class="chip" style="font-size:0.8rem; padding:6px 12px; margin-top:8px;" onclick="send('recipe for ${r.name.replace(/'/g, "\\'")}')">See full recipe</button>`;
        }

        card.innerHTML = html;
        container.appendChild(card);
      });
    }

    async function send(text) {
      addMsg('user', text);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        
        // Add the bot's text reply and get the bubble element
        const bubble = addMsg('bot', data.reply);
        
        // If there are recipes, attach them to the bot's bubble
        if (data.recipes && data.recipes.length > 0) {
          renderRecipes(bubble, data.recipes, data.full);
          scrollChat();
        }

      } catch (e) {
        addMsg('bot', 'Sorry, I am having trouble connecting right now.');
      }
    }

    // Form submit
    form.addEventListener('submit', e => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = '';
      send(t);
    });

    // Chips click
    document.getElementById('chips').addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') {
        send(e.target.textContent);
      }
    });

    // Initial Greeting
    addMsg('bot', "Hi! I'm your Recipe Assistant!\nWhat would you like to cook today?");

  </script>
</body>
</html>
