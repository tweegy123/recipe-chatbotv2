<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABDUL - Recipe Finder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="logo">
      <div class="logo-circle">A</div>
      <span class="logo-text">ABDUL</span>
    </div>
    <div class="nav-links">
      <a href="#" id="nav-home" class="nav-link active" onclick="switchTab('home', event)">Home</a>
      <a href="#" id="nav-all" class="nav-link" onclick="switchTab('all', event)">All Recipe</a>
    </div>
  </nav>

  <!-- HOME VIEW -->
  <main id="home-view">
    <section class="hero">
      <h1>Cook something good<br>tonight.</h1>
      <p>Browse thousands of recipes, or just ask ABDUL what to make with what you have.</p>
      <button class="cta-button" onclick="switchTab('all')">Browse recipes</button>
    </section>
  </main>

  <!-- ALL RECIPE VIEW (Hidden by default) -->
  <section id="browse-view" class="hidden">
    <div class="browse-header">
      <h2>All Recipes</h2>
      <button class="cta-button outline" onclick="switchTab('home')">Back to Home</button>
    </div>
    <div id="recipe-grid" class="recipe-grid">
      <p>Loading recipes...</p>
    </div>
  </section>

  <!-- FLOATING CHAT WIDGET -->
  <div class="chat-widget">
    <div class="chat-header">
      <span class="chat-title">ABDUL</span>
      <span class="chat-subtitle">Ask me for a recipe</span>
    </div>
    
    <div id="log" class="log" aria-live="polite"></div>

    <!-- Chips -->
    <div class="chips" id="chips">
      <button>Quick Meals</button>
      <button>Spicy</button>
      <button>Vegetarian</button>
      <button>Creamy</button>
    </div>

    <!-- Input Composer -->
    <form id="form" class="composer">
      <input id="input" type="text" placeholder="Ask for a recipe..." autocomplete="off" maxlength="300" aria-label="Message">
      <button type="submit" class="hidden-btn">Send</button>
    </form>
  </div>

  <script>
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const chips = document.getElementById('chips');
    const recipeGrid = document.getElementById('recipe-grid');
    const homeView = document.getElementById('home-view');
    const browseView = document.getElementById('browse-view');
    const navHome = document.getElementById('nav-home');
    const navAll = document.getElementById('nav-all');

    // --- 10-Second Toast Logic ---
    function showToast(message, recipeName) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast';
      
      const actionText = recipeName ? `<span class="toast-action">Click to see ingredients</span>` : '';
      
      toast.innerHTML = `
        <div class="toast-icon">✅</div>
        <div class="toast-text">
          <strong>${message}</strong>
          ${actionText}
        </div>
      `;
      
      toast.onclick = () => {
        if (recipeName) send('recipe for ' + recipeName);
        document.querySelector('.chat-widget').scrollIntoView({ behavior: 'smooth' });
        toast.remove(); 
      };

      container.appendChild(toast);
      setTimeout(() => toast.classList.add('show'), 10);

      // 10,000 ms = 10 seconds
      const timer = setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => toast.remove(), 300); 
      }, 10000);
      
      toast.addEventListener('click', () => clearTimeout(timer), { once: true });
    }

    // --- Chat Logic ---
    function scrollChat() { log.scrollTop = log.scrollHeight; }
    
    function addMsg(who, text) {
      const m = document.createElement('div');
      m.className = 'msg ' + who;
      const p = document.createElement('p');
      p.textContent = text;
      m.appendChild(p);
      log.appendChild(m);
      scrollChat();
      return m;
    }

    function createChatCard(r, full) {
      const c = document.createElement('article');
      c.className = 'card';
      c.innerHTML = `<h3>${r.name}</h3><p class="meta">⏱ ${r.time} min</p>`;
      
      if (r.tools) {
        c.innerHTML += `<div class="tools-list">🔧 Tools: ${r.tools.join(', ')}</div>`;
      }

      if (r.have) {
        if (r.have.length) c.innerHTML += `<p class="have">You have: ${r.have.join(', ')}</p>`;
        c.innerHTML += `<p class="miss">${r.missing.length ? 'Still need: ' + r.missing.join(', ') : 'You have everything!'}</p>`;
      }

      if (full) {
        c.innerHTML += `<h4>Ingredients</h4><ul>${r.ingredients.map(i => `<li>${i}</li>`).join('')}</ul>`;
        c.innerHTML += `<h4>Steps</h4><ol>${r.steps.map(s => `<li>${s}</li>`).join('')}</ol>`;
      } else {
        const b = document.createElement('button');
        b.className = 'link';
        b.textContent = 'See recipe';
        b.onclick = () => send('recipe for ' + r.name);
        c.appendChild(b);
      }
      return c;
    }

    async function send(text) {
      addMsg('user', text);
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = await res.json();
        
        const m = addMsg('bot', d.reply);
        
        document.getElementById('toast-container').innerHTML = '';
        const completeRecipes = [];

        (d.recipes || []).forEach(r => {
          m.appendChild(createChatCard(r, d.full));
          if (r.missing && r.missing.length === 0) completeRecipes.push(r.name);
        });

        if (completeRecipes.length > 0) {
          completeRecipes.slice(0, 3).forEach(name => showToast(`You have all ingredients for ${name}!`, name));
          if (completeRecipes.length > 3) showToast(`And ${completeRecipes.length - 3} more recipes you can cook!`, null);
        }
      } catch (e) {
        addMsg('bot', 'Sorry, I cannot reach the server right now.');
      }
      scrollChat();
    }

    // --- Tab Switching Logic ---
    function switchTab(tab, event) {
      if(event) event.preventDefault();

      // Remove active class from both, then add to the clicked one
      navHome.classList.remove('active');
      navAll.classList.remove('active');

      if (tab === 'home') {
        navHome.classList.add('active');
        
        // Show Hero & Chat Input, Hide Grid
        homeView.classList.remove('hidden');
        browseView.classList.add('hidden');
        chips.classList.remove('hidden');
        form.classList.remove('hidden');
        
      } else if (tab === 'all') {
        navAll.classList.add('active');
        
        // Hide Hero & Chat Input, Show Grid
        homeView.classList.add('hidden');
        browseView.classList.remove('hidden');
        chips.classList.add('hidden');
        form.classList.add('hidden');
        
        loadAllRecipes();
      }
    }

    // --- Load All Recipes Grid ---
    async function loadAllRecipes() {
      recipeGrid.innerHTML = '<p>Loading recipes...</p>';
      try {
        const res = await fetch('/api/recipes');
        const recipes = await res.json();
        
        recipeGrid.innerHTML = '';
        recipes.forEach(r => {
          const item = document.createElement('article');
          item.className = 'grid-card';
          
          const previewIngredients = r.ingredients.slice(0, 4).map(i => `<li>${i.qty} ${i.name}</li>`).join('');
          const moreText = r.ingredients.length > 4 ? `<li>...and more</li>` : '';

          item.innerHTML = `
            <h3>${r.name}</h3>
            <p class="meta">${r.time} min</p>
            <ul class="preview-list">${previewIngredients}${moreText}</ul>
            <button class="link" onclick="viewRecipeFromGrid('${r.name.replace(/'/g, "\\'")}')">See full recipe</button>
          `;
          recipeGrid.appendChild(item);
        });
      } catch (err) {
        recipeGrid.innerHTML = '<p>Error loading recipes.</p>';
      }
    }

    // When clicking a recipe in the grid, it sends it to the chat
    function viewRecipeFromGrid(name) {
      send('recipe for ' + name);
      document.querySelector('.chat-widget').scrollIntoView({ behavior: 'smooth' });
    }

    // --- Event Listeners ---
    form.addEventListener('submit', e => {
      e.preventDefault();
      const t = input.value.trim();
      if (!t) return;
      input.value = '';
      send(t);
    });

    chips.addEventListener('click', e => {
      if (e.target.tagName === 'BUTTON') send(e.target.textContent);
    });

    // Initial Greeting
    addMsg('bot', 'Hi! What are you in the mood for tonight?');
  </script>
</body>
</html>
